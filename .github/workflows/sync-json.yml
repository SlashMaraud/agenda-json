name: Sync JSON

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PRIMARY_URL: "https://vacaionesenelmar.xo.je/hashes.json"
      BACKUP_URL: "https://raw.githubusercontent.com/SlashMaraud/agenda-json/main/hashes.json"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create backup folder
        run: mkdir -p backups

      - name: Backup previous JSON
        run: |
          if [ -f hashes.json ]; then
            cp hashes.json backups/hashes_$(date +"%Y%m%d_%H%M%S").json
          fi

      - name: Download JSON (primary + fallback)
        run: |
          echo "Intentando descargar JSON desde la URL principal..."
          curl -A "Mozilla/5.0" -s -f -o hashes.json.tmp "$PRIMARY_URL" || true

          if ! jq empty hashes.json.tmp 2>/dev/null; then
            echo "La URL principal falló. Probando URL de respaldo..."
            curl -A "Mozilla/5.0" -s -f -o hashes.json.tmp "$BACKUP_URL" || true
          fi

          echo "Contenido descargado:"
          cat hashes.json.tmp
          echo "---- FIN DEL CONTENIDO ----"

      - name: Validate JSON
        run: |
          echo "Validando JSON..."

          if ! jq empty hashes.json.tmp 2>/dev/null; then
            echo "ERROR: El archivo descargado NO es JSON válido. No se actualiza."
            exit 0
          fi

          if [ "$(jq length hashes.json.tmp)" = "0" ]; then
            echo "ERROR: JSON vacío. No se actualiza."
            exit 0
          fi

      - name: Optimize JSON
        run: |
          echo "Optimizando JSON..."
          jq -c . hashes.json.tmp > hashes.json

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No hay cambios que subir"
            exit 0
          fi

          git config --global user.name "SlashMaraud"
          git config --global user.email "actions@github.com"
          git add hashes.json backups/
          git commit -m "Auto update JSON (validación + fallback + bloqueo de JSON vacío)"
          git push
