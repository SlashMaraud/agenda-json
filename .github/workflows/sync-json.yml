name: Sync JSON

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SOURCE_URL: "https://raw.githubusercontent.com/SlashMaraud/agenda-json/main/hashes.json"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create backup folder
        run: mkdir -p backups

      - name: Backup previous JSON
        run: |
          if [ -f hashes.json ]; then
            cp hashes.json backups/hashes_$(date +"%Y%m%d_%H%M%S").json
          fi

      - name: Download JSON from GitHub
        run: |
          echo "Descargando JSON desde GitHub..."
          curl -s -f -o hashes.json.tmp "$SOURCE_URL"

          echo "Contenido descargado:"
          cat hashes.json.tmp
          echo "---- FIN ----"

      - name: Validate JSON
        run: |
          echo "Validando JSON..."

          if ! jq empty hashes.json.tmp 2>/dev/null; then
            echo "ERROR: JSON inválido"
            exit 0
          fi

          HASH_COUNT=$(jq '.hashes | length' hashes.json.tmp 2>/dev/null || echo 0)

          if [ "$HASH_COUNT" -eq 0 ]; then
            echo "ERROR: JSON válido pero sin hashes. No se actualiza."
            exit 0
          fi

          echo "JSON válido con $HASH_COUNT hashes."

      - name: Optimize JSON
        run: jq -c . hashes.json.tmp > hashes.json

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No hay cambios que subir"
            exit 0
          fi

          git config --global user.name "SlashMaraud"
          git config --global user.email "actions@github.com"
          git add hashes.json backups/
          git commit -m "Auto update JSON from GitHub"
          git push
