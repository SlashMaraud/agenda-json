name: Sync JSON

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      PRIMARY_URL: "https://vacacionesenelmar.xo.je/hashes.json"
      BACKUP_URL: "https://raw.githubusercontent.com/SlashMaraud/agenda-json/main/hashes.json"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create backup folder
        run: mkdir -p backups

      - name: Backup previous JSON
        run: |
          if [ -f hashes.json ]; then
            cp hashes.json backups/hashes_$(date +"%Y%m%d_%H%M%S").json
          fi

      - name: Download JSON (with real browser headers)
        run: |
          echo "Descargando JSON desde la URL principal..."

          curl -s -f \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: application/json,text/html;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: es-ES,es;q=0.9,en;q=0.8" \
            -H "Cache-Control: no-cache" \
            -o primary.json \
            "$PRIMARY_URL" || true

          if jq empty primary.json 2>/dev/null; then
            echo "La URL principal devolvió JSON válido."
            cp primary.json hashes.json.tmp
          else
            echo "La URL principal falló. Probando URL de respaldo..."

            curl -s -f \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -H "Accept: application/json,text/html;q=0.9,*/*;q=0.8" \
              -H "Accept-Language: es-ES,es;q=0.9,en;q=0.8" \
              -H "Cache-Control: no-cache" \
              -o backup.json \
              "$BACKUP_URL" || true

            if jq empty backup.json 2>/dev/null; then
              echo "La URL de respaldo devolvió JSON válido."
              cp backup.json hashes.json.tmp
            else
              echo "ERROR: Ninguna fuente devolvió JSON válido."
              exit 0
            fi
          fi

          echo "Contenido final descargado:"
          cat hashes.json.tmp
          echo "---- FIN ----"

      - name: Validate JSON
        run: |
          echo "Validando JSON..."

          if ! jq empty hashes.json.tmp 2>/dev/null; then
            echo "ERROR: JSON inválido"
            exit 0
          fi

          HASH_COUNT=$(jq '.hashes | length' hashes.json.tmp 2>/dev/null || echo 0)

          if [ "$HASH_COUNT" -eq 0 ]; then
            echo "ERROR: JSON válido pero sin hashes. No se actualiza."
            exit 0
          fi

          echo "JSON válido con $HASH_COUNT hashes."

      - name: Optimize JSON
        run: jq -c . hashes.json.tmp > hashes.json

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No hay cambios que subir"
            exit 0
          fi

          git config --global user.name "SlashMaraud"
          git config --global user.email "actions@github.com"
          git add hashes.json backups/
          git commit -m "Auto update JSON (headers + UA fix)"
          git push
