name: Actualizar hashes

on:
  schedule:
    - cron: "0 * * * *"   # Cada hora
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Descargar JSON
        run: |
          curl -L -o hashes.json "http://agendadeportiva.x10.mx/hashes.json"

      - name: Commit si hay cambios
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add hashes.json
          git diff --cached --quiet || git commit -m "Actualización automática de hashes"
          git push
