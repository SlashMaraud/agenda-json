name: Sync JSON

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create backup folder
        run: mkdir -p backups

      - name: Backup previous JSON
        run: |
          if [ -f hashes.json ]; then
            cp hashes.json backups/hashes_$(date +"%Y%m%d_%H%M%S").json
          fi

      - name: Download JSON with retries
        run: |
          echo "Intentando descargar JSON desde xo.je..."
          intentos=0
          exito=0

          while [ $intentos -lt 5 ]; do
            curl -A "Mozilla/5.0" -s -f -o hashes.json.tmp https://vacaionesenelmar.xo.je/hashes.json && exito=1 && break
            intentos=$((intentos+1))
            echo "Fallo en intento $intentos, reintentando..."
            sleep 5
          done

          if [ $exito -ne 1 ]; then
            echo "ERROR: No se pudo descargar el JSON después de 5 intentos"
            exit 0
          fi

      - name: Validate JSON
        run: |
          echo "Validando JSON..."
          if ! jq empty hashes.json.tmp 2>/dev/null; then
            echo "ERROR: El archivo descargado NO es JSON válido"
            exit 0
          fi

          if [ "$(jq length hashes.json.tmp)" = "0" ]; then
            echo "ERROR: JSON vacío, no se actualiza"
            exit 0
          fi

      - name: Optimize JSON
        run: |
          echo "Optimizando JSON..."
          jq -c . hashes.json.tmp > hashes.json

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No hay cambios que subir"
            exit 0
          fi

          git config --global user.name "SlashMaraud"
          git config --global user.email "actions@github.com"
          git add hashes.json backups/
          git commit -m "Auto update JSON con validación, backup y optimización"
          git push
