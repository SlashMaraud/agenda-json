name: Sync JSON

on:
  schedule:
    - cron: "*/30 * * * *"   # Cada 30 minutos
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download JSON from xo.je
        run: |
          curl -A "Mozilla/5.0" -o hashes.json https://vacaionesenelmar.xo.je/hashes.json

      - name: Commit changes
        run: |
          git config --global user.name "SlashMaraud"
          git config --global user.email "actions@github.com"
          git add hashes.json
          git commit -m "Auto update JSON" || echo "No changes to commit"
          git push
